*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;width:100%;}
body{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#C5B59A;border-radius:2px;}::-webkit-scrollbar-track{background:transparent;}
@keyframes pulsarAnim{0%{transform:scale(1);opacity:0.9;}50%{transform:scale(1.18);opacity:0.45;}100%{transform:scale(1);opacity:0.9;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
.pa{animation:pulsarAnim 2s ease-in-out 2;animation-fill-mode:forwards;transform-origin:center;}
.it{animation:fadeUp 1s ease-out 1.5s both;}.is{animation:fadeUp 1s ease-out 2.2s both;}
.iin{animation:fadeIn 0.3s ease-out both;}.iout{animation:fadeOut 0.8s ease-out forwards;pointer-events:none;}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;line-height:1.7;white-space:nowrap;}
.pill{border-radius:20px;padding:5px 13px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;letter-spacing:0.03em;white-space:nowrap;background:transparent;}
.pill:hover{opacity:0.75;}
input,textarea,select{font-family:'Inter',sans-serif;font-size:13px;border-radius:8px;padding:10px 12px;width:100%;outline:none;transition:border-color 0.15s;}
input[type="date"]{cursor:pointer;}
textarea{resize:vertical;min-height:72px;}
.sl{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;margin-bottom:8px;display:block;}
.card{border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow 0.15s;}
.ql{border-radius:6px;padding:3px 9px;font-size:9.5px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all 0.15s;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;background:transparent;}
.ql.done{background:#4E7C5A!important;color:#fff!important;border-color:#4E7C5A!important;}
.sv{width:100%;padding:13px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.3s;letter-spacing:0.05em;color:#F6F1E9;}
.sv.ok{background:#4E7C5A!important;}
.tile{border-radius:10px;padding:12px 14px;flex:1;text-align:center;}
.si{border-radius:24px;padding:9px 16px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
.icon-btn{background:transparent;border:none;cursor:pointer;padding:4px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;opacity:0.45;transition:opacity 0.15s;}
.icon-btn:hover{opacity:0.85;}

const parseBday=str=>{
  if(!str)return null;
  if(str.includes('-')&&str.length>=8){const p=str.split('-');if(p.length===3){const now=new Date();const d=new Date(now.getFullYear(),parseInt(p[1])-1,parseInt(p[2]));if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(now.getFullYear()+1);return d;}}
  const parts=str.trim().toLowerCase().split(/[\s,]+/);if(parts.length<2)return null;
  const mi=MONTHS.map(m=>m.toLowerCase()).indexOf(parts[0]);const day=parseInt(parts[1]);
  if(mi===-1||isNaN(day))return null;
  const now=new Date();const d=new Date(now.getFullYear(),mi,day);if(d<now)d.setFullYear(now.getFullYear()+1);return d;
};
const fmtBday=str=>{
  if(!str)return'';
  if(str.includes('-')&&str.length>=8){const p=str.split('-');if(p.length===3){const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}}
  return str;
};
const bdayIn14=str=>{const d=parseBday(str);if(!d)return false;const diff=(d-new Date())/86400000;return diff>=0&&diff<=14;};
const bdayDays=str=>{const d=parseBday(str);if(!d)return null;return Math.max(0,Math.round((d-new Date())/86400000));};

function Pulsar({size=80,color='#C9A870',animate=false,onClick}){
  const cx=80,cy=80,outer=52,circles=[22,36,52],lens=[22,16,11];
  return(
    <svg width={size} height={size} viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"
      className={animate?'pa':''} onClick={onClick}
      style={{display:'block',overflow:'visible',cursor:onClick?'pointer':'default'}}>
      {Array.from({length:12},(_,i)=>{const a=((i*30-90)*Math.PI)/180,l=lens[i%3];return <line key={i} x1={cx+Math.cos(a)*outer} y1={cy+Math.sin(a)*outer} x2={cx+Math.cos(a)*(outer+l)} y2={cy+Math.sin(a)*(outer+l)} stroke={color} strokeWidth="1.5" strokeLinecap="round" opacity="0.85"/>;})
      }
      {circles.map((r,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="1.2" opacity={0.85-i*0.2}/>)}
      <circle cx={cx} cy={cy} r="4" fill={color}/>
    </svg>
  );
}

function MonthCalendar({contacts,onOpen}){
  const th=useTh();
  const [year,setYear]=useState(new Date().getFullYear());
  const [month,setMonth]=useState(new Date().getMonth());
  const [selected,setSelected]=useState(null);

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const todayKey=todayStr();

  const byDate={};
  contacts.forEach(c=>{
    if(c.nad){
      const d=new Date(c.nad+'T00:00:00');
      if(d.getFullYear()===year&&d.getMonth()===month){
        const day=d.getDate();
        if(!byDate[day])byDate[day]=[];
        byDate[day].push(c);
      }
    }
  });

  const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);setSelected(null);};
  const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);setSelected(null);};
  const monthName=new Date(year,month,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const selContacts=selected?byDate[selected]||[]:[];

  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'12px 16px 10px',background:th.lHead,borderBottom:`1px solid ${th.bdr}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={prevMonth} style={{background:'transparent',border:`1px solid ${th.bdr}`,borderRadius:6,width:28,height:28,cursor:'pointer',color:th.tMed,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
          <span style={{fontFamily:'Cormorant Garamond',fontSize:20,fontWeight:400,color:th.text}}>{monthName}</span>
          <button onClick={nextMonth} style={{background:'transparent',border:`1px solid ${th.bdr}`,borderRadius:6,width:28,height:28,cursor:'pointer',color:th.tMed,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginTop:10,gap:2}}>
          {DAY_LABELS.map(d=><div key={d} style={{textAlign:'center',fontFamily:'Inter',fontSize:9,fontWeight:500,letterSpacing:'0.1em',color:th.tLt,textTransform:'uppercase',padding:'4px 0'}}>{d}</div>)}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'8px 12px 80px',background:th.bg}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:16}}>
          {cells.map((d,i)=>{
            if(!d)return <div key={`e${i}`}/>;
            const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday=dateStr===todayKey;
            const contacts=byDate[d]||[];
            const isSel=selected===d;
            const dot=contacts.length>0?(contacts.length===1?FCOLOR[contacts[0].freq]?.color||'#9E9288':'#9E9288'):null;
            return(
              <div key={d} onClick={()=>setSelected(isSel?null:d)}
                style={{borderRadius:8,padding:'6px 4px',textAlign:'center',cursor:contacts.length>0?'pointer':'default',background:isSel?'rgba(92,143,181,0.15)':(isToday?'rgba(201,168,112,0.12)':'transparent'),border:isToday?`1px solid rgba(201,168,112,0.35)`:`1px solid transparent`,transition:'background 0.15s'}}>
                <div style={{fontFamily:'Inter',fontSize:12,fontWeight:isToday?600:400,color:isToday?'#A87C38':th.text,marginBottom:3}}>{d}</div>
                {dot&&<div style={{width:6,height:6,borderRadius:'50%',background:dot,margin:'0 auto'}}/>}
                {contacts.length>1&&<div style={{fontSize:8,color:th.tLt,marginTop:2}}>{contacts.length}</div>}
              </div>
            );
          })}
        </div>
        {selected&&selContacts.length>0&&(
          <div>
            <div style={{fontFamily:'Inter',fontSize:9,fontWeight:500,letterSpacing:'0.12em',textTransform:'uppercase',color:th.tLt,marginBottom:10}}>
              {new Date(year,month,selected).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
            </div>
            {selContacts.map(c=>{
              const fc=FCOLOR[c.freq]||FCOLOR.monthly;
              const st=STATUS[c.status];
              return(
                <div key={c.id} className="card" onClick={()=>onOpen(c.id)} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontFamily:'Cormorant Garamond',fontSize:18,fontWeight:400,color:th.text}}>{c.fn} {c.ln}</div>
                    {c.starter&&<div style={{fontFamily:'Cormorant Garamond',fontStyle:'italic',fontSize:13,color:th.tMed,marginTop:2}}>{c.starter}</div>}
                    <div style={{display:'flex',gap:6,marginTop:4}}>
                      {st&&<Bdg color={th.tMed} bg={th.noteBg}>{st.label}</Bdg>}
                      {fc&&<Bdg color={fc.color} bg={fc.bg}>{FREQ[c.freq]?.label}</Bdg>}
                    </div>
                  </div>
                  {c.na&&<span style={{fontSize:11,color:th.tLt,fontStyle:'italic',flexShrink:0,marginLeft:8}}>{c.na}</span>}
                </div>
              );
            })}
          </div>
        )}
        {selected&&selContacts.length===0&&(
          <div style={{textAlign:'center',padding:'20px 0',fontFamily:'Cormorant Garamond',fontSize:18,fontStyle:'italic',color:th.tLt}}>No contacts scheduled for this day</div>
        )}
      </div>
    </div>
  );
}

function WeekView({contacts,onOpen,onQL,logged}){
  const th=useTh();
  const [weekStart,setWeekStart]=useState(()=>{
    const d=new Date();d.setHours(0,0,0,0);
    const day=d.getDay();d.setDate(d.getDate()-day);return d;
  });
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d;
  });
  const fmt=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const dStr=d=>d.toISOString().split('T')[0];
  const todayKey=todayStr();
  const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);};
  const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);};
  const weekLabel=`${days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'12px 16px 10px',background:th.lHead,borderBottom:`1px solid ${th.bdr}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={prevWeek} style={{background:'transparent',border:`1px solid ${th.bdr}`,borderRadius:6,width:28,height:28,cursor:'pointer',color:th.tMed,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
          <span style={{fontFamily:'Cormorant Garamond',fontSize:18,fontWeight:400,color:th.text}}>{weekLabel}</span>
          <button onClick={nextWeek} style={{background:'transparent',border:`1px solid ${th.bdr}`,borderRadius:6,width:28,height:28,cursor:'pointer',color:th.tMed,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px 80px',background:th.bg}}>
        {days.map(day=>{
          const ds=dStr(day);
          const dayContacts=contacts.filter(c=>c.nad===ds).sort((a,b)=>`${a.ln}${a.fn}`.localeCompare(`${b.ln}${b.fn}`));
          const isToday=ds===todayKey;
          return(
            <div key={ds} style={{marginBottom:18}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                <div style={{width:3,height:14,borderRadius:2,background:isToday?'#B0607A':th.bdr,flexShrink:0}}/>
                <span style={{fontFamily:'Inter',fontSize:10,fontWeight:500,letterSpacing:'0.1em',textTransform:'uppercase',color:isToday?'#B0607A':th.tLt}}>
                  {day.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
                  {isToday&&' — Today'}
                </span>
              </div>
              {dayContacts.length===0
                ?<div style={{fontSize:12,color:th.tLt,fontStyle:'italic',paddingLeft:11,opacity:0.5}}>Nothing scheduled</div>
                :dayContacts.map(c=>{
                  const fc=FCOLOR[c.freq]||FCOLOR.monthly;
                  const st=STATUS[c.status];
                  return(
                    <div key={c.id} className="card" onClick={()=>onOpen(c.id)}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:4}}>
                        <span style={{fontFamily:'Cormorant Garamond',fontSize:19,fontWeight:400,color:th.text}}>{c.fn} {c.ln}</span>
                        <div style={{display:'flex',gap:4,flexShrink:0}}>
                          {st&&<Bdg color={th.tMed} bg={th.noteBg}>{st.label}</Bdg>}
                          {fc&&<Bdg color={fc.color} bg={fc.bg}>{FREQ[c.freq]?.label}</Bdg>}
                        </div>
                      </div>
                      {c.starter&&<div style={{fontFamily:'Cormorant Garamond',fontStyle:'italic',fontSize:13,color:th.tMed,marginBottom:5}}>{c.starter}</div>}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <span style={{fontSize:11,color:th.tMed}}>{c.na||''}</span>
                        <button className={`ql${logged[c.id]?' done':''}`} onClick={e=>{e.stopPropagation();onQL(c.id);}}>
                          {logged[c.id]?'✓ Logged':'Quick Log'}
                        </button>
                      </div>
                    </div>
                  );
                })
              }
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── CCard ─────────────────────────────────────────────────────────────────────
function CCard({c,onOpen,onQL,logged}){
  const th=useTh();
  const fc=FCOLOR[c.freq]||FCOLOR.monthly;
  const st=STATUS[c.status];
  const dd=c.nad?daysUntil(c.nad):null;
  let nc=th.tLt,nl='';
  if(c.nad){
    if(dd<0){nc='#B03030';nl=`${Math.abs(dd)}d overdue`;}
    else if(dd===0){nc='#B0607A';nl='Today';}
    else if(dd<=7){nc='#5C8FB5';nl=`in ${dd} days`;}
    else{nc=th.tLt;nl=`in ${dd} days`;}
  }
  return(
    <div className="card" onClick={()=>onOpen(c.id)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:4}}>
        <span style={{fontFamily:'Cormorant Garamond',fontSize:20,fontWeight:400,color:th.text,lineHeight:1.2}}>{c.fn} {c.ln}</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end',flexShrink:0}}>
          {st&&<Bdg color={th.tMed} bg={th.noteBg}>{st.label}</Bdg>}
          {fc&&<Bdg color={fc.color} bg={fc.bg}>{FREQ[c.freq]?.label||c.freq}</Bdg>}
        </div>
      </div>
      {c.starter&&<div style={{fontFamily:'Cormorant Garamond',fontStyle:'italic',fontSize:14,color:th.tMed,marginBottom:6,lineHeight:1.45}}>{c.starter}</div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',minWidth:0}}>
          {c.ph&&<span style={{fontSize:12,color:th.tMed}}>{c.ph}</span>}
          {c.nad?<span style={{fontSize:11,color:nc,fontWeight:500}}>{c.na&&c.na+' · '}{nl}</span>
            :<span style={{fontSize:11,color:th.tLt,fontStyle:'italic'}}>Unscheduled</span>}
        </div>
        <button className={`ql${logged?' done':''}`} onClick={e=>{e.stopPropagation();onQL(c.id);}}>
          {logged?'✓ Logged':'Quick Log'}
        </button>
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────

  const unsched=contacts.filter(c=>!c.nad);
  const bdays=contacts.filter(c=>bdayIn14(c.birthday)).sort((a,b)=>(bdayDays(a.birthday)||99)-(bdayDays(b.birthday)||99));

          ))}
        </div>

      {showReminder&&(
        <div style={{background:'rgba(168,124,56,0.12)',borderBottom:'1px solid rgba(168,124,56,0.25)',padding:'10px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <span style={{fontSize:12,color:'#A87C38',flex:1,fontFamily:'Inter'}}>{lastExport?`Last backup: ${daysSince} days ago.`:'Contacts not yet backed up.'} Export now?</span>

                  </div>
                  <span style={{fontSize:11,color:'#A87C38',fontWeight:500}}>{bdayDays(c.birthday)===0?'Today 🎂':`in ${bdayDays(c.birthday)}d`}</span>

              ))}
            </div>
          )}
          {unsched.length>0&&(
            <div style={{borderTop:`1px solid ${th.bdr}`,paddingTop:18,marginTop:6}}>
              <div className="card" onClick={onUnsched} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontFamily:'Cormorant Garamond',fontSize:17,fontStyle:'italic',color:th.tMed}}>{unsched.length} contact{unsched.length!==1?'s':''} unscheduled</span>

          )}

      <div style={{padding:'10px 20px',background:th.lHead,borderTop:`1px solid ${th.bdr}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>

        <div style={{fontFamily:'Inter',fontSize:9,color:th.tLt,letterSpacing:'0.1em',textTransform:'uppercase',opacity:0.5}}>

        </div>
      </div>
    </div>
  );
}

// ── List ──────────────────────────────────────────────────────────────────────
function List({contacts,freqFilter,onOpen,onQL,logged,onAdd}){
  const th=useTh();
  const [search,setSearch]=useState('');
  const [sf,setSf]=useState(null);
  const title=freqFilter==='unscheduled'?'Unscheduled':freqFilter?FREQ[freqFilter]?.label:'All Contacts';
  const fc=freqFilter?FCOLOR[freqFilter]:null;
  const tc=fc?fc.color:th.text;
  const list=contacts
    .filter(c=>freqFilter==='unscheduled'?!c.nad:freqFilter?c.freq===freqFilter:true)
    .filter(c=>sf?c.status===sf:true)
    .filter(c=>{
      if(!search)return true;const q=search.toLowerCase();
      return `${c.fn} ${c.ln}`.toLowerCase().includes(q)||(c.ph&&c.ph.includes(q))||(c.notes&&c.notes.toLowerCase().includes(q))||(c.starter&&c.starter.toLowerCase().includes(q));
    })
    .sort((a,b)=>{
      if(a.nad&&b.nad)return a.nad.localeCompare(b.nad);
      if(a.nad)return -1;if(b.nad)return 1;
      return `${a.ln}${a.fn}`.localeCompare(`${b.ln}${b.fn}`);
    });
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{background:th.lHead,borderBottom:`1px solid ${th.bdr}`,flexShrink:0,padding:'14px 16px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div>
            <div style={{fontFamily:'Cormorant Garamond',fontSize:22,fontWeight:400,color:tc}}>{title}</div>
            <div style={{fontFamily:'Inter',fontSize:10.5,color:th.tLt,marginTop:2}}>{list.length} contacts</div>
          </div>
          <button onClick={onAdd} style={{background:'#16293D',color:'#F6F1E9',border:'none',borderRadius:'50%',width:34,height:34,fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>+</button>
        </div>
        <input className="si" placeholder="Search name, notes, phone…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <div style={{display:'flex',gap:5,marginTop:10,overflowX:'auto',paddingBottom:2}}>
          {[null,...Object.values(STATUS)].map(s=>(
            <button key={s?.key||'all'} className="pill" onClick={()=>setSf(s?s.key:null)}
              style={{color:sf===(s?.key||null)?'#243C58':th.tMed,background:sf===(s?.key||null)?'#C4D9EE':'transparent',borderColor:sf===(s?.key||null)?'#5C8FB5':th.pillBdr,fontSize:10,padding:'3px 10px'}}>
              {s?s.label:'All'}
            </button>
          ))}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px 80px',background:th.bg}}>
        {list.length===0&&<div style={{textAlign:'center',paddingTop:60,fontFamily:'Cormorant Garamond',fontSize:20,fontStyle:'italic',color:th.tLt}}>No contacts found</div>}
        {list.map(c=><CCard key={c.id} c={c} onOpen={onOpen} onQL={onQL} logged={!!logged[c.id]}/>)}
      </div>
    </div>
  );
}

            <div style={{display:'flex',gap:10,justifyContent:'center',alignItems:'center'}}>
              <span style={{fontSize:12,color:'#B03030'}}>Remove this contact?</span>
              <button onClick={()=>onDelete(contact.id)} style={{background:'#B03030',color:'#fff',border:'none',borderRadius:6,padding:'4px 14px',fontSize:12,cursor:'pointer'}}>Confirm</button>
              <button onClick={()=>setCdel(false)} style={{background:'transparent',border:`1px solid ${th.pillBdr}`,color:th.tMed,borderRadius:6,padding:'4px 14px',fontSize:12,cursor:'pointer'}}>Cancel</button>
            </div>
          ):(
            <button onClick={()=>setCdel(true)} style={{background:'transparent',border:'none',color:th.tLt,fontSize:12,cursor:'pointer',textDecoration:'underline',opacity:0.6}}>Remove from Small Circles</button>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Add ───────────────────────────────────────────────────────────────────────
function Add({onSave,onBack}){
  const th=useTh();
  const [f,setF]=useState({id:uid(),fn:'',ln:'',ph:'',em:'',src:'SOI',met:todayStr(),na:'',nad:'',bn:'',notes:'',freq:'monthly',status:'new',birthday:'',starter:'',log:[],addr1:'',city:'',state:'',zip:'',anniversaries:[]});
  const [addrOpen,setAddrOpen]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{background:th.hdr,padding:'14px 18px',flexShrink:0,display:'flex',alignItems:'center',gap:12}}>
        <button onClick={onBack} style={{background:'rgba(110,97,88,0.2)',border:'1px solid rgba(110,97,88,0.45)',borderRadius:'50%',width:32,height:32,cursor:'pointer',color:'#9E9288',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        <div style={{fontFamily:'Cormorant Garamond',fontSize:22,fontWeight:400,color:'#F6F1E9'}}>New Contact</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 16px 40px',background:th.bg}}>
        <ContactForm f={f} set={set} addrOpen={addrOpen} setAddrOpen={setAddrOpen}/>
        <button className="sv" onClick={()=>{if(f.fn.trim())onSave(f);}} style={{marginTop:8,opacity:f.fn.trim()?1:0.45}}>Add to Small Circles</button>
      </div>
    </div>
  );
}

// ── Info Panel ────────────────────────────────────────────────────────────────
function InfoPanel({onClose,onExport,onImport,onImportCSV,lastExport}){
  const importRef=useRef();
  const csvRef=useRef();
  const daysSince=lastExport?Math.abs(daysUntil(lastExport)):null;
  const downloadTemplate=()=>{
    const h='First Name,Last Name,Phone,Email,Source,Notes,Frequency,Status,Birthday,Conversation Starter';
    const ex='Jane,Smith,(310) 555-0101,jane@email.com,SOI,Loves Brentwood. Two kids.,Monthly,Nurturing,June 12,Ask about her home search timeline';
    const blob=new Blob([h+'\n'+ex],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='small-circles-template.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'#16293D',zIndex:500,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,overflowY:'auto'}}>
      <div style={{textAlign:'center',maxWidth:300,width:'100%'}} onClick={e=>e.stopPropagation()}>
        <Pulsar size={46} color="#C9A870"/>
        <div style={{fontFamily:'Cormorant Garamond',fontSize:22,fontWeight:300,color:'#F6F1E9',letterSpacing:'0.14em',marginTop:14,marginBottom:28,textTransform:'uppercase'}}>Small Circles</div>
        <div style={{textAlign:'left'}}>
          <div style={{fontFamily:'Inter',fontSize:9,letterSpacing:'0.18em',color:'#C9A870',textTransform:'uppercase',marginBottom:14}}>Data Backup</div>
          <div style={{fontSize:11,color:'rgba(246,241,233,0.45)',fontFamily:'Inter',marginBottom:16,lineHeight:1.7}}>
            {USE_SB?`Syncing to Supabase — your contacts are safe across all devices.${lastExport?' Last exported '+daysSince+' days ago.':''}`:(lastExport?`Last exported ${daysSince} days ago · ${fmtDate(lastExport)}`:'Never exported — contacts exist only in this browser.')+' Export weekly and keep the file in iCloud or Google Drive.'}
          </div>
          <button onClick={e=>{e.stopPropagation();onExport();}} style={{width:'100%',padding:'10px',background:'rgba(168,124,56,0.2)',border:'1px solid rgba(168,124,56,0.45)',borderRadius:8,color:'#C9A870',fontFamily:'Inter',fontSize:12,fontWeight:500,cursor:'pointer',marginBottom:8,letterSpacing:'0.06em'}}>↓ Export contacts (JSON)</button>
          <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>{onImport(e.target.files[0]);e.target.value='';}}/>
          <button onClick={e=>{e.stopPropagation();importRef.current.click();}} style={{width:'100%',padding:'10px',background:'transparent',border:'1px solid rgba(201,168,112,0.2)',borderRadius:8,color:'rgba(246,241,233,0.45)',fontFamily:'Inter',fontSize:12,cursor:'pointer',letterSpacing:'0.06em',marginBottom:20}}>↑ Import backup (JSON)</button>
          <div style={{fontFamily:'Inter',fontSize:9,letterSpacing:'0.18em',color:'#C9A870',textTransform:'uppercase',marginBottom:14}}>Import Contacts</div>
          <div style={{fontSize:11,color:'rgba(246,241,233,0.45)',fontFamily:'Inter',marginBottom:14,lineHeight:1.7}}>Import from a spreadsheet or phone export. Download the template, fill it in, and import.</div>
          <button onClick={e=>{e.stopPropagation();downloadTemplate();}} style={{width:'100%',padding:'10px',background:'rgba(92,143,181,0.15)',border:'1px solid rgba(92,143,181,0.35)',borderRadius:8,color:'#C4D9EE',fontFamily:'Inter',fontSize:12,fontWeight:500,cursor:'pointer',marginBottom:8,letterSpacing:'0.06em'}}>↓ Download CSV template</button>
          <input ref={csvRef} type="file" accept=".csv" style={{display:'none'}} onChange={e=>{onImportCSV(e.target.files[0]);e.target.value='';}}/>
          <button onClick={e=>{e.stopPropagation();csvRef.current.click();}} style={{width:'100%',padding:'10px',background:'transparent',border:'1px solid rgba(92,143,181,0.25)',borderRadius:8,color:'rgba(196,217,238,0.5)',fontFamily:'Inter',fontSize:12,cursor:'pointer',letterSpacing:'0.06em',marginBottom:20}}>↑ Import from CSV</button>
          <div style={{borderTop:'1px solid rgba(201,168,112,0.15)',paddingTop:20}}>
            <div style={{fontFamily:'Inter',fontSize:9,letterSpacing:'0.18em',color:'#C9A870',textTransform:'uppercase',marginBottom:12}}>Customization</div>
            <div style={{fontSize:11,color:'rgba(246,241,233,0.45)',fontFamily:'Inter',lineHeight:1.7}}>Built with Claude at claude.ai. Take your index.html to Claude and describe any changes — colors, fields, features. No coding required.</div>
          </div>
        </div>
        <div style={{fontFamily:'Inter',fontSize:10,color:'rgba(201,168,112,0.3)',marginTop:28,letterSpacing:'0.1em'}} onClick={onClose}>Tap outside to dismiss</div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [ip,setIp]=useState('visible');
  const [dark,setDark]=useState(()=>localStorage.getItem('sc-dark')==='1');
  const [contacts,setContacts]=useState([]);
  const [screen,setScreen]=useState('dashboard');
  const [nav,setNav]=useState('home');
  const [ff,setFf]=useState(null);
  const [sid,setSid]=useState(null);
  const [infoOpen,setInfoOpen]=useState(false);
  const [logged,setLogged]=useState({});
  const [prev,setPrev]=useState('dashboard');
  const [lastExport,setLastExport]=useState(()=>localStorage.getItem('sc-last-export')||null);
  const [dismissed,setDismissed]=useState(()=>localStorage.getItem('sc-export-dismissed')===todayStr());
  const [toast,setToast]=useState(null);
  const [dashView,setDashView]=useState('daily');
  const th=mkTh(dark);

  useEffect(()=>{
    const t1=setTimeout(()=>setIp('fading'),4500);
    const t2=setTimeout(()=>setIp('done'),5300);
    loadContacts().then(saved=>{setContacts((saved||DEFAULTS).map(migrateContact));});
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);

  const persist=next=>{setContacts(next);saveContacts(next);};
  const handleNav=k=>{setNav(k);if(k==='home'){setScreen('dashboard');}else{setFf(k==='all'?null:k);setScreen('list');}};
  const openContact=id=>{setPrev(screen);setSid(id);setScreen('detail');};
  const quickLog=id=>{
    const c=contacts.find(x=>x.id===id);if(!c)return;
    const days=FREQ[c.freq]?.days;
    persist(contacts.map(x=>x.id!==id?x:{...x,lc:todayStr(),meth:'Logged',nad:days?addDays(todayStr(),days):x.nad}));
    setLogged(p=>({...p,[id]:true}));
    setTimeout(()=>setLogged(p=>{const n={...p};delete n[id];return n;}),2200);
  };
  const saveContact=data=>{
    const exists=contacts.some(c=>c.id===data.id);
    persist(exists?contacts.map(c=>c.id===data.id?data:c):[...contacts,data]);
  };
  const deleteContact=id=>{persist(contacts.filter(c=>c.id!==id));setScreen(prev==='detail'?'dashboard':prev);setNav('home');};
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),3000);};
  const toggleDark=()=>{const nd=!dark;setDark(nd);localStorage.setItem('sc-dark',nd?'1':'0');};
  const doExport=()=>{
    const blob=new Blob([JSON.stringify(contacts,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`small-circles-${todayStr()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    const d=todayStr();localStorage.setItem('sc-last-export',d);setLastExport(d);showToast('✓ Contacts exported');
  };
  const doImport=file=>{
    if(!file)return;const r=new FileReader();
    r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(Array.isArray(data)&&data.length>0){persist(data.map(migrateContact));setInfoOpen(false);showToast(`✓ ${data.length} contacts imported`);}else showToast('No contacts found in file');}catch{showToast('Invalid backup file');}};
    r.readAsText(file);
  };
  const doImportCSV=file=>{
    if(!file)return;const r=new FileReader();
    r.onload=ev=>{
      try{
        const lines=ev.target.result.trim().split('\n');if(lines.length<2){showToast('No contacts found in CSV');return;}
        const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
        const fi=headers.findIndex(h=>h.includes('first')),li=headers.findIndex(h=>h.includes('last'));
        const pi=headers.findIndex(h=>h.includes('phone')),ei=headers.findIndex(h=>h.includes('email'));
        const si=headers.findIndex(h=>h.includes('source')),ni=headers.findIndex(h=>h.includes('notes'));
        const fri=headers.findIndex(h=>h.includes('freq')),sti=headers.findIndex(h=>h.includes('status'));
        const bi=headers.findIndex(h=>h.includes('birthday')),ci=headers.findIndex(h=>h.includes('conversation')||h.includes('starter'));
        const get=(cols,i)=>i>=0&&cols[i]?cols[i].trim().replace(/^"|"$/g,''):'';
        const freqMap={weekly:'weekly',monthly:'monthly',quarterly:'quarterly',annually:'annually',bespoke:'bespoke'};
        const statusMap={new:'new',friend:'friend',nurturing:'nurturing',active:'active',legacy:'legacy'};
        const newContacts=lines.slice(1).filter(l=>l.trim()).map(line=>{
          const cols=line.split(',');
          return{id:uid(),fn:get(cols,fi),ln:get(cols,li),ph:get(cols,pi),em:get(cols,ei),src:get(cols,si)||'SOI',notes:get(cols,ni),
            freq:freqMap[get(cols,fri).toLowerCase()]||'monthly',status:statusMap[get(cols,sti).toLowerCase()]||'new',
            birthday:get(cols,bi),starter:get(cols,ci),met:'',lc:'',meth:'',res:'',na:'',nad:'',bn:'',log:[],addr1:'',city:'',state:'',zip:'',anniversaries:[]};
        }).filter(c=>c.fn||c.ln);
        if(newContacts.length===0){showToast('No valid contacts found');return;}
        const merged=[...contacts];
        newContacts.forEach(nc=>{if(!merged.find(e=>`${e.fn}${e.ln}`.toLowerCase()===`${nc.fn}${nc.ln}`.toLowerCase()))merged.push(nc);});
        persist(merged);setInfoOpen(false);showToast(`✓ ${newContacts.length} contacts imported from CSV`);
      }catch{showToast('Could not read CSV file');}
    };
    r.readAsText(file);
  };
  const dismissReminder=()=>{localStorage.setItem('sc-export-dismissed',todayStr());setDismissed(true);};
  const showReminder=!dismissed&&!USE_SB&&(!lastExport||(daysUntil(lastExport)||0)<-7);
  const sel=contacts.find(c=>c.id===sid);

  return(
    <ThCtx.Provider value={th}>
      <style>{dynCSS(dark)}</style>
      {ip!=='done'&&<Intro phase={ip}/>}
      {infoOpen&&<InfoPanel onClose={()=>setInfoOpen(false)} onExport={doExport} onImport={doImport} onImportCSV={doImportCSV} lastExport={lastExport}/>}
      {toast&&(
        <div style={{position:'fixed',bottom:70,left:'50%',transform:'translateX(-50%)',background:'#16293D',color:'#C9A870',padding:'10px 20px',borderRadius:8,fontSize:12,fontFamily:'Inter',zIndex:900,whiteSpace:'nowrap',boxShadow:'0 4px 20px rgba(0,0,0,0.25)'}}>
          {toast}
        </div>
      )}
      <div style={{maxWidth:600,margin:'0 auto',height:'100vh',display:'flex',flexDirection:'column',background:th.bg,opacity:ip!=='done'?0:1,transition:'opacity 0.5s ease-out'}}>
        {screen!=='detail'&&screen!=='add'&&<TopNav active={nav} onNav={handleNav}/>}
        {screen==='dashboard'&&(
          <Dashboard contacts={contacts} onOpen={openContact} onQL={quickLog} logged={logged}
            onInfo={()=>setInfoOpen(true)} onAdd={()=>{setPrev(screen);setScreen('add');}}
            onUnsched={()=>{setFf('unscheduled');setNav('all');setScreen('list');}}
            showReminder={showReminder} lastExport={lastExport} onExport={doExport} onDismiss={dismissReminder}
            onToggleDark={toggleDark} view={dashView} onViewChange={setDashView}/>
        )}
        {screen==='list'&&(
          <List contacts={contacts} freqFilter={ff} onOpen={openContact} onQL={quickLog} logged={logged}
            onAdd={()=>{setPrev(screen);setScreen('add');}}/>
        )}
        {screen==='detail'&&sel&&(()=>{
          const sorted=[...contacts].sort((a,b)=>{if(a.nad&&b.nad)return a.nad.localeCompare(b.nad);if(a.nad)return -1;if(b.nad)return 1;return `${a.ln}${a.fn}`.localeCompare(`${b.ln}${b.fn}`);});
          const idx=sorted.findIndex(c=>c.id===sel.id);
          const nc=sorted[idx+1],pc=sorted[idx-1];
          return <Detail key={sel.id} contact={sel} onSave={saveContact} onDelete={deleteContact}
            onBack={()=>setScreen(prev==='detail'?'dashboard':prev)}
            onNext={()=>nc&&setSid(nc.id)} onPrev={()=>pc&&setSid(pc.id)}
            hasNext={!!nc} hasPrev={!!pc}/>;
        })()}
        {screen==='add'&&(
          <Add onSave={data=>{saveContact(data);setFf(null);setNav('all');setScreen('list');}}
            onBack={()=>setScreen(prev)}/>
        )}
      </div>
    </ThCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
